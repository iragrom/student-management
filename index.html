<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Список студентов</title>

    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <nav class="navbar">
        <div class="navbar__brand">
            <span class="navbar__icon">🐈</span>
            <span class="navbar__title">Студенты</span>
        </div>
        <ul class="navbar__menu">
            <li class="navbar__item"><a href="index.html" class="navbar__link active" aria-current="page">📋 Список</a></li>
            <li class="navbar__item"><a href="form.html" class="navbar__link">➕ Добавить</a></li>
        </ul>
    </nav>

    <main class="container">

        <div class="view__header">
            <h1>📋 Список студентов</h1>
            <a href="form.html" class="btn btn--primary">➕ Добавить студента</a>
        </div>

        <!-- ============================================================
             ПАНЕЛЬ ФИЛЬТРОВ
             Первые 2 поля — «простые»: уходят в GET как ?group=...&dormitory=...
             Если пользователь раскрывает расширенный фильтр и заполняет
             больше 2 полей — уходит QUERY с JSON в теле запроса.
             ============================================================ -->
        <section class="filters" id="filters-panel">

            <!-- Базовый ряд: всегда виден -->
            <div class="filters__row">
                <div class="filters__field">
                    <label for="filter-group">Группа</label>
                    <input type="text" id="filter-group" placeholder="P3224" autocomplete="off" />
                </div>
                <div class="filters__field">
                    <label for="filter-dorm">Общежитие</label>
                    <input type="number" id="filter-dorm" placeholder="3" min="1" max="10"
                           inputmode="numeric" autocomplete="off" />
                </div>
            </div>

            <!-- Расширенный ряд: скрыт по умолчанию -->
            <div class="filters__row filters__row--advanced" id="filters-advanced" hidden>
                <div class="filters__field">
                    <label for="filter-name">ФИО (поиск)</label>
                    <input type="text" id="filter-name" placeholder="Иванов" autocomplete="off" />
                </div>
                <div class="filters__field">
                    <label for="filter-isu">ИСУ</label>
                    <input type="number" id="filter-isu" placeholder="123456" min="1" max="999999"
                           inputmode="numeric" autocomplete="off" />
                </div>
                <div class="filters__field">
                    <label for="filter-room">Комната</label>
                    <input type="number" id="filter-room" placeholder="305" min="100" max="999"
                           inputmode="numeric" autocomplete="off" />
                </div>
                <div class="filters__field">
                    <label for="filter-date">Дата заселения</label>
                    <input type="date" id="filter-date" />
                </div>
                <div class="filters__field">
                    <label for="filter-foreigner">Иностранец</label>
                    <select id="filter-foreigner">
                        <option value="">Все</option>
                        <option value="true">Только иностранцы</option>
                        <option value="false">Только не иностранцы</option>
                    </select>
                </div>
            </div>

            <div class="filters__actions">
                <button type="button" class="btn btn--secondary" id="btn-filter-toggle">
                    ⚙️ Расширенный фильтр
                </button>
                <button type="button" class="btn btn--primary" id="btn-filter-apply">
                    🔍 Применить
                </button>
                <button type="button" class="btn btn--secondary" id="btn-filter-reset">
                    ✖ Сбросить
                </button>
            </div>

            <!-- Куда выводим текст «Найдено N студентов» -->
            <div class="filters__summary" id="filters-summary"></div>
        </section>

        <div class="table-wrapper">
            <table class="student-table" id="student-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ФИО</th>
                        <th>Группа</th>
                        <th>ИСУ</th>
                        <th>Общ.</th>
                        <th>Комната</th>
                        <th>Иностр.</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="student-table-body"></tbody>
            </table>
        </div>

        <div id="empty-state" class="empty-state" style="display:none;">
            <p>😺 Пока нет студентов. Нажмите «Добавить студента», чтобы создать первую запись.</p>
        </div>

        <!-- Индикатор загрузки: показывается, пока идёт fetch -->
        <div id="loading" class="loading" hidden>⏳ Загрузка…</div>

    </main>

    <!-- Скрипты. Порядок важен: api → validation → students → ui → app -->
    <script src="js/api.js" defer></script>
    <script src="js/validation.js" defer></script>
    <script src="js/students.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/app.js" defer></script>

</body>
</html>
