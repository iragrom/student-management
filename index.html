<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Список студентов</title>


    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈</text></svg>" />

    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- НАВИГАЦИЯ -->
    <nav class="navbar">
        <div class="navbar__brand">
            <span class="navbar__icon">🐈</span>
            <span class="navbar__title">Студенты</span>
        </div>

        <ul class="navbar__menu">
            <!-- Текущая страница помечена классом active -->
            <li class="navbar__item">
                <a href="index.html" class="navbar__link active" aria-current="page">📋 Список</a>
            </li>
            <li class="navbar__item">
                <a href="form.html" class="navbar__link">➕ Добавить</a>
            </li>
        </ul>
    </nav>

    <!--ОСНОВНОЙ КОНТЕНТ -->
    <main class="container">

        <div class="view__header">
            <h1>📋 Список студентов</h1>

            <a href="form.html" class="btn btn--primary">➕ Добавить студента</a>
        </div>


        <div class="table-wrapper">
            <table class="student-table" id="student-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ФИО</th>
                        <th>Группа</th>
                        <th>ИСУ</th>
                        <th>Общ.</th>
                        <th>Комната</th>
                        <th>Иностр.</th>
                        <th>Действия</th>
                    </tr>
                </thead>

                <tbody id="student-table-body"></tbody>
            </table>
        </div>

        <!-- Заглушка, если нет ни одного студента. -->
        <div id="empty-state" class="empty-state" style="display:none;">
            <p>😺 Пока нет студентов. Нажмите «Добавить студента», чтобы создать первую запись.</p>
        </div>

    </main>


    <script src="js/storage.js" defer></script>
    <script src="js/students.js" defer></script>
    <script src="js/validation.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/app.js" defer></script>

</body>
</html>
